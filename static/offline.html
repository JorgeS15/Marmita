<!doctype html>
<html lang="pt-PT">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="light dark" />
		<title>Sem ligação · Marmita</title>
		<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
		<style>
			:root { --bg: #faf7f2; --text: #1c1917; --muted: #6b6259; --accent: #c2410c; --on-accent: #fff; }
			@media (prefers-color-scheme: dark) {
				:root { --bg: #12100e; --text: #f5f0ea; --muted: #a8a29e; --accent: #fb923c; --on-accent: #1c1917; }
			}
			body {
				margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px;
				box-sizing: border-box; background: var(--bg); color: var(--text); text-align: center;
				font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
			}
			img { width: 72px; height: 72px; }
			h1 { font-size: 1.3rem; margin: 16px 0 8px; }
			p { color: var(--muted); margin: 0 0 20px; max-width: 320px; }
			button {
				min-height: 44px; padding: 0 20px; border: 0; border-radius: 10px; font: inherit; font-weight: 600;
				background: var(--accent); color: var(--on-accent); cursor: pointer;
			}
		</style>
	</head>
	<body>
		<main>
			<img src="/icons/favicon.svg" alt="" />
			<h1>Sem ligação ao servidor</h1>
			<p>A Marmita precisa de ligação ao servidor para mostrar o inventário e o calendário.</p>
			<button onclick="location.reload()">Tentar de novo</button>
		</main>
		<script>
			addEventListener('online', () => location.reload());
		</script>
	</body>
</html>
