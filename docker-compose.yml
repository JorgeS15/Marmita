services:
  marmita:
    build: .
    image: marmita:latest
    # Em alternativa ao build local, usar a imagem publicada pelo GitHub Actions:
    # image: ghcr.io/jorges15/marmita:latest
    container_name: marmita
    restart: unless-stopped
    ports:
      - "4004:4004"
    environment:
      ORIGIN: https://marmita.exemplo.pt # URL pública (opcional)
      TZ: Europe/Lisbon
      # Opcional: imprimir etiquetas através do Home Assistant (integração Marklife)
      # HA_URL: http://homeassistant.local:8123
      # HA_TOKEN: <token de acesso de longa duração do HA>
    volumes:
      - ./data:/data
